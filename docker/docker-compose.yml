# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
# 
# 使用方式:
#   定时模式: docker-compose -f ./docker/docker-compose.yml up -d analyzer
#   FastAPI模式: docker-compose -f ./docker/docker-compose.yml up -d server
#   同时启动: docker-compose -f ./docker/docker-compose.yml up -d analyzer server
# 离线镜像部署也以本文件为配置真源：scripts/package-image.cmd 随包交付副本，
# scripts/update-image.sh 安装至服务器 docker/docker-compose.yml，并自动生成实例覆盖配置。
# 服务器实例的 deployment.env、数据挂载、端口和网络由覆盖配置保留；不部署 Caddy。

name: ${COMPOSE_PROJECT_NAME:-dsa-remote}

x-common: &common
  image: daily_stock_analysis:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # 环境变量从部署目录 deployment.env 注入；运行时保存到 state/data/runtime.env。
  # 不要将环境文件作为单文件 volume 挂载到 /app/.env，
  # 否则 Docker mount point 会阻止配置保存时的 os.replace 原子更新。
  env_file:
    - ${DSA_ENV_FILE:-../deployment.env}

  volumes:
    - ../state/data:/app/data
    - ../state/logs:/app/logs
    - ../state/reports:/app/reports
    # Longbridge OAuth token cache persistence; entrypoint repairs container-side ownership for dsa user.
    # Create ../state/longbridge_tokens on the host before copying an authorized token cache into it.
    - ../state/longbridge_tokens:/home/dsa/.longbridge
    # 如需覆盖前端静态资源，可挂载本地 static 目录
    # - ../static:/app/static:ro

  environment:
    - TZ=Asia/Shanghai

    # Web/API service bind address (must be 0.0.0.0 inside container)
    - WEBUI_HOST=0.0.0.0
    - ENV_FILE=/app/data/runtime.env
    - DATABASE_PATH=/app/data/stock_analysis.db
    - LOG_DIR=/app/logs
    - WEBUI_PORT=${API_PORT:-8000}
    - WEBUI_AUTO_BUILD=false
    - TRUST_X_FORWARDED_FOR=${DSA_TRUST_PROXY:-false}
    # API_PORT 从 deployment.env 文件读取，无需在此硬编码

    # 代理设置（如果需要）
    # - http_proxy=http://host.docker.internal:10809
    # - https_proxy=http://host.docker.internal:10809
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # 资源限制：完整分析建议 1G+；512M 仅适合轻量 Web/API、单股、低并发场景，
  # 且建议设置 MAX_WORKERS=1 并避免同时启动 analyzer 和 server。
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  # 定时任务模式
  analyzer:
    <<: *common
    container_name: stock-analyzer
    profiles: [analyzer]

  # FastAPI 模式
  server:
    <<: *common
    container_name: dsa-server
    networks:
      default:
      feedback_net:
        aliases: [dsa-server]
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    # 若使用 network_mode: host，则以下 ports 映射无效，端口由 command 中的 --port 指定
    ports:
      - "${DSA_WEB_PORT:-${API_PORT:-8000}}:${API_PORT:-8000}"

# Reuse the existing Nginx network; no Caddy or HTTPS service is started.
networks:
  feedback_net:
    external: true
    name: ${DSA_PROXY_NETWORK:?Set DSA_PROXY_NETWORK to the existing Nginx Docker network}
